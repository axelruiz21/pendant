[project]
name = "pendant"
version = "0.1.0"
description = "Programming-by-demonstration: capture repetitive browser processes and compile them into maintainable, instrumented automations. Phase 0: capture through validated IR."
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.45",
    "pydantic>=2.7",
]

[project.scripts]
pendant = "pendant.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pendant"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["pendant", "tests"]

[[tool.mypy.overrides]]
module = "playwright.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
